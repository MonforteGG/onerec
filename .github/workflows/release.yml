name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check tag matches Cargo.toml
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne "v$ver") {
            throw "tag $tag does not match package version $ver"
          }
      - name: Test
        run: cargo test --locked -- --test-threads=1
      - name: Build
        run: cargo build --release --locked
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "target/release/onerec.exe"
          if (-not (Test-Path $exe)) { throw "missing $exe" }
          $stage = Join-Path $env:RUNNER_TEMP "onerec-zip"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -Force $exe (Join-Path $stage "onerec.exe")
          Copy-Item -Force LICENSE, NOTICE $stage
          $zip = Join-Path (Get-Location) "onerec.zip"
          if (Test-Path $zip) { Remove-Item -Force $zip }
          Compress-Archive -Path "$stage\*" -DestinationPath $zip
          if (-not (Test-Path $zip)) { throw "missing $zip" }
          $prev = gh release list --json tagName --jq ".[0].tagName"
          $notes = @"
          Download ``onerec.zip``, Extract All, and run ``onerec.exe`` from that folder. Windows names the folder ``onerec``; leave the exe there so ``onerec.ini`` stays beside it. v1 is Windows 10 and later only.

          This patch replaces $prev for new downloads. If onerec is already installed, open it and use Update.

          The app is that one executable. LAME, the icon, and the Lucide font are inside it. The first run creates ``onerec.ini`` beside the exe. The API key, if you set one, goes to Windows Credential Manager.

          The zip also has ``LICENSE`` and ``NOTICE``. Include those if you redistribute the app.

          If Windows reports that ``VCRUNTIME140.dll`` is missing, install the Visual C++ 2015-2022 x64 redistributable from https://learn.microsoft.com/en-us/cpp/windows/latest-supported-vc-redist
          "@
          $ghArgs = @("release", "create", $tag, $zip, "--title", $tag, "--notes", $notes, "--generate-notes")
          if ($prev) { $ghArgs += @("--notes-start-tag", $prev) }
          gh @ghArgs
